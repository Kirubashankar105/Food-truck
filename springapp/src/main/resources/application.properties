# Database configuration
spring.datasource.url=jdbc:mysql://localhost:3306/venddb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=shankar2212@
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Allow circular references
spring.main.allow-circular-references=true

# Server configuration
server.port=8080
server.servlet.context-path=/

# JWT configuration - Use a more secure key
jwt.secret=myverylongsecretkeythatis32characterslong!@#$%^&*()1234567890
jwt.expiration=36000000

# Logging configuration
logging.level.com.examly.springapp=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Jackson configuration for better JSON handling
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=NON_NULL

# File upload configuration (if you plan to add document uploads later)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Application name
spring.application.name=foodtruck-vendor-system

# Error handling
server.error.include-message=always
server.error.include-binding-errors=always